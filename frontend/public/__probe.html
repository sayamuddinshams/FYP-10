<!doctype html>
<html>
  <head><meta charset="utf-8"><title>probe</title></head>
  <body>
    <pre id="out">pending</pre>
    <script>
      try { localStorage.setItem('rentlink.session', JSON.stringify({ userId: 'u11' })); } catch (e) {}
      var f = document.createElement('iframe');
      f.style.cssText = 'width:1440px;height:2400px;border:1px solid #ccc';
      f.src = '/admin/dashboard';
      document.body.appendChild(f);

      function read() {
        try {
          var d = f.contentDocument;
          var out = [];
          var svgs = d.querySelectorAll('main svg');
          for (var i = 0; i < svgs.length; i++) {
            var svg = svgs[i];
            var sr = svg.getBoundingClientRect();
            if (sr.width < 120) continue; // skip icons
            var texts = svg.querySelectorAll('text');
            for (var j = 0; j < texts.length; j++) {
              var tr = texts[j].getBoundingClientRect();
              if (tr.width === 0) continue;
              var clippedLeft = tr.left < sr.left - 0.5;
              var clippedRight = tr.right > sr.right + 0.5;
              if (clippedLeft || clippedRight) {
                out.push({
                  txt: texts[j].textContent,
                  svgW: Math.round(sr.width),
                  overflowPx: Math.round(clippedLeft ? (sr.left - tr.left) : (tr.right - sr.right)),
                  side: clippedLeft ? 'left' : 'right'
                });
              }
            }
          }
          var res = { clippedLabels: out, count: out.length };
          document.getElementById('out').textContent = 'RESULT:' + JSON.stringify(res, null, 2);
        } catch (e) {
          document.getElementById('out').textContent = 'ERROR:' + e.message;
        }
      }
      f.addEventListener('load', function () { setTimeout(read, 4000); });
    </script>
  </body>
</html>
